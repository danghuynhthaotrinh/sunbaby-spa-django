{% extends "base.html" %}

{% block content %}
<style>
  .services-page { color: #2b2b2b; }
  .services-page .services-nav { background: #d9a441; padding: 12px 20px; border-radius: 10px; font-weight: 600; margin-bottom: 20px; }
  .services-page .services-nav a { color: #fff; text-decoration: none; margin-right: 18px; }
  .services-page main { max-width: 1100px; margin: 0 auto; }
  .services-page .tabs { display: inline-flex; gap: 6px; background: #f3e0a8; padding: 6px; border-radius: 10px; margin-bottom: 16px; }
  .services-page .tabs a { padding: 8px 16px; border-radius: 8px; text-decoration: none; color: #5a4410; }
  .services-page .tabs a.on { background: #fff; font-weight: 600; }
  .services-page table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  .services-page th { background: #fbefc8; text-align: left; font-size: 13px; }
  .services-page th, .services-page td { padding: 10px 12px; border-bottom: 1px solid #f0e6cc; }
  .services-page .btn { display: inline-block; padding: 6px 12px; border: 1px solid #d9a441; border-radius: 8px; background: #fff; color: #7a5a10; text-decoration: none; cursor: pointer; font-size: 13px; }
  .services-page .btn.primary { background: #a8741a; color: #fff; border-color: #a8741a; }
  .services-page .pill { padding: 3px 10px; border-radius: 12px; font-size: 12px; }
  .services-page .ok { background: #e0f5e4; color: #1d7a35; }
  .services-page .off { background: #eee; color: #777; }
  .services-page .warn { background: #fde8c8; color: #9a5a00; }
  .services-page .msg { padding: 10px 14px; border-radius: 8px; background: #e0f5e4; margin-bottom: 12px; }
  .services-page .err, .services-page .errorlist { color: #b3261e; font-size: 13px; list-style: none; padding: 0; margin: 4px 0; }
  .services-page .cards { display: flex; gap: 16px; flex-wrap: wrap; }
  .services-page .card { flex: 1; min-width: 240px; background: #fff; padding: 20px; border-radius: 14px; }
  .services-page input, .services-page select, .services-page textarea { padding: 7px; border: 1px solid #ddd; border-radius: 8px; }
</style>
<div class="services-page">
  <nav class="services-nav">
    <a href="{% url 'services:home' %}">Hệ thống Quản lý dịch vụ</a>
    <a href="{% url 'services:package_list' %}">Gói dịch vụ</a>
  </nav>
  <main>
    {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
    {% if tab %}
    <div class="tabs">
      <a href="{% url 'services:package_list' %}" class="{% if tab == 'goi' %}on{% endif %}">Tạo gói &amp; Thiết lập BOM</a>
      <a href="{% url 'services:cost_list' %}" class="{% if tab == 'cost' %}on{% endif %}">Đơn giá vốn lý thuyết</a>
    </div>
    {% endif %}
    {% block services_content %}{% endblock %}
  </main>
</div>
{% endblock %}
