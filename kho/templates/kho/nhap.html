<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lập phiếu nhập · Sun Baby</title><style>body{background:#fbf6eb;color:#49351f;font:16px Arial;margin:0}header{background:#C8963E;color:white;padding:18px}main{max-width:900px;margin:24px auto;background:white;padding:22px;border-radius:10px}fieldset{border:1px solid #eadcc3;margin:12px 0}button{background:#C8963E;color:white;border:0;padding:11px 16px}</style></head><body><header><h1>Lập phiếu nhập kho</h1></header><main>{% for message in messages %}<p>{{ message }}</p>{% endfor %}<form method="post">{% csrf_token %}<h2>Thông tin phiếu</h2>{{ form.as_p }}<h2>Các dòng hàng</h2>{{ formset.management_form }}{% for dong in formset %}<fieldset>{{ dong.as_p }}</fieldset>{% endfor %}<button type="submit">Xác nhận nhập kho</button></form><p><a href="{% url 'kho:index' %}">Quay lại</a></p></main></body></html>
