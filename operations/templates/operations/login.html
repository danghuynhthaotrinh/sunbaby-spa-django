{% load static %}<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · Sunbaby Spa</title><link rel="stylesheet" href="{% static 'operations/operations.css' %}"></head><body class="login-page"><main class="login-card"><a href="{% url 'operations_home' %}" class="login-brand">SUN BABY</a><h1>Đăng nhập vận hành</h1><p>Dành cho Quản lý/Thủ kho và Admin.</p><form method="post" class="op-form">{% csrf_token %}{% if form.errors %}<div class="alert bad">Tên đăng nhập hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.</div>{% endif %}<div class="field"><label for="id_username">Tên đăng nhập</label><input id="id_username" name="username" autocomplete="username" value="{{ form.username.value|default:'' }}" required autofocus></div><div class="field"><label for="id_password">Mật khẩu</label><input id="id_password" name="password" type="password" autocomplete="current-password" required></div><input type="hidden" name="next" value="{{ next|default:'/operations/' }}"><button class="button primary" type="submit">Đăng nhập →</button></form></main></body></html>
